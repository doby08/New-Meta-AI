<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stakeholder Survey · AI Assistance Interview System</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#3b6ef6">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233b6ef6'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>S</text></svg>">
<style>
.survey-wrap{max-width:640px;margin:0 auto;padding:18px 14px 60px}
.lang-toggle{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;gap:5px;margin:12px 0}
.lang-toggle button{flex:1;border:0;border-radius:10px;padding:11px;font-weight:700;font-size:15px;background:transparent;color:var(--muted);cursor:pointer}
.lang-toggle button.on{background:linear-gradient(135deg,#3b6ef6,#7c3aed);color:#fff}
.qr-badges{display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0}
.qr-badge{display:flex;gap:10px;align-items:center;background:var(--hint-bg);border:1px solid var(--hint-bd);border-radius:12px;padding:10px 12px;font-size:14px}
.qr-badge .k{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:86px}
.qr-badge .v{font-weight:700}
.qr-badge .lock{margin-left:auto}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.q-card textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--input);color:var(--ink)}
#syncStatus{border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0;background:var(--hint-bg);border:1px solid var(--hint-bd);color:var(--hint-ink)}
#syncStatus[data-mode="offline"]{background:#fef9c3;border-color:#fde047;color:#854d0e}
#syncStatus[data-mode="syncing"]{background:#e0f2fe;border-color:#7dd3fc;color:#075985}
.score-hero{text-align:center;padding:22px;border-radius:18px;color:#fff;background:linear-gradient(135deg,#3b6ef6,#7c3aed);margin:14px 0}
.score-hero .n{font-size:56px;font-weight:800;line-height:1}
@media(max-width:560px){.role-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="survey-wrap">
  <div class="card">
    <div class="card-head"><div><h2 id="tTitle">📝 Stakeholder Survey</h2><p class="muted" id="tSub">Piliin ang wika at ang inyong kategorya.</p></div></div>
    <div id="syncStatus" data-mode="online">✅ Online — handa nang sumagot.</div>
    <!-- QR context (read-only badges when ?title=&category=&role= present) -->
    <div id="qrCtx" class="qr-badges hidden"></div>
    <!-- STEP 1: Language Toggle Selector (Tagalog | English) — always interactive -->
    <label class="field"><span id="tLang">Wika / Language</span>
      <div class="lang-toggle" role="tablist">
        <button type="button" id="langTl" class="on">🇵🇭 Tagalog</button>
        <button type="button" id="langEn">🇬🇧 English</button>
      </div>
    </label>
    <!-- STEP 2: Topic Selection (gawing simple, walang role buttons) -->
    <div id="manualCtx">
    <label class="field"><span id="tTopic">Paksa / Topic</span><select id="topicSel"></select></label>
    <label class="field"><span id="tQCount">Ilang Tanong / Number of Questions</span>
      <input id="qCount" type="number" min="1" max="10" value="3" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--input);font:inherit;font-size:16px">
    </label>
    </div>
    <button class="btn btn-primary btn-block" id="startBtn"><span class="btn-label">▶ Simulan ang Interview</span><span class="spinner hidden"></span></button>
    <p class="login-hint" id="tQrHint">Na-scan ang QR? Awtomatikong napili ang inyong kategorya. Maaari pa rin itong palitan.</p>
  </div>
  <div id="qWrap"></div>
  <div id="resultWrap"></div>
  <p style="text-align:center;margin-top:18px"><a href="/public/dashboard">📊 Tingnan ang Public Dashboard</a></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/dexie@3.2.5/dist/dexie.min.js"></script>
<script src="/offline-db.js"></script>
<script src="/sync.js"></script>
<script src="/survey.js"></script>
<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(() => {}); } SyncManager.init();</script>
</body>
</html>
